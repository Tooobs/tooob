# A Relay on a VPS (README.md): the Relay image, built here from image/, where deploy.sh has put the
# Bootstrap Bundle. Its settings are in .env, which deploy.sh writes next to this file.
services:
  relay:
    build:
      context: image
      args:
        DNS_PROVIDER: ${DNS_PROVIDER:-cloudflare}
    image: tooob-relay
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
      DNS_API_TOKEN: ${DNS_API_TOKEN:?set DNS_API_TOKEN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy's certificates, kept across upgrades: Let's Encrypt limits how often it reissues them.
      - caddy-data:/data
    restart: unless-stopped
volumes:
  caddy-data:
