services:
  relay:
    image: n0computer/iroh-relay:v1.3.0
    command: ["--config-path", "/etc/iroh-relay.toml"]
    ports:
      - "80:80"
      - "443:443"
      - "7842:7842/udp"
    volumes:
      - ./iroh-relay.toml:/etc/iroh-relay.toml:ro
      - certs:/certs
    restart: unless-stopped
volumes:
  certs:
