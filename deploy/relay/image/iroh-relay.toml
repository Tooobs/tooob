# tooob-relay (stock iroh-relay's config file) behind Caddy, in the same container: Caddy holds
# the certificates and hands iroh's paths to this plain-HTTP listener, which nothing outside the
# container reaches. No [tls], so no QUIC address discovery (UDP 7842): it helps native endpoints
# punch holes, which v1 doesn't need. Who may use this Relay is its Enrolled Keys (ADR 0030), in
# /data/tooob-relay/enrolled.toml: none, and anyone can, so enroll your Host Keys (`tooob-relay
# enroll`) before you share it. `access` stays unset.
http_bind_addr = "127.0.0.1:3340"
enable_metrics = false
