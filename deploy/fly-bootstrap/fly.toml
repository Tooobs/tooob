# Your own Bootstrap (bootstrap/www) as a static HTTPS site, at https://<app>.fly.dev/ (the URL you
# give `tooob add --bootstrap`). First time: set `app` to a name of your own, then
# `fly launch --copy-config --no-deploy` to claim it. After that, ./deploy.sh: it assembles the
# build context, since www/ needs its built WASM.
app = "your-bootstrap-app"
primary_region = "sjc"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # static files; a cold start is fine
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
