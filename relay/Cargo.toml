# tooob-relay, tooob's own Relay (ADR 0030, #128): iroh-relay's server, from the patched copy in
# iroh-relay/, forwarding a packet only if its sender or its receiver is an Enrolled Key. A
# workspace of its own, so the Relay image builds it from this folder alone.
[package]
name = "tooob-relay"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "tooob's Relay: iroh-relay, carrying only traffic that touches an Enrolled Key"
repository = "https://github.com/Tooobs/tooob"
publish = false

[workspace]
exclude = ["iroh-relay"]

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
http = "1"
iroh-base = { version = "1.3.0", default-features = false, features = ["key", "relay"] }
iroh-relay = { path = "iroh-relay", features = ["server"] }
n0-error = "1.0.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.33", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
toml = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5.3", features = ["serde"] }
webpki_types = { package = "rustls-pki-types", version = "1.12" }

[dev-dependencies]
iroh-dns = "1.3.0"
n0-future = "0.3"
rand = "0.10"
tempfile = "3"

[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }
