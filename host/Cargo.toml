[package]
name = "tooob"
version = "0.1.0-rc.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A semi-private web: a Host makes a Site reachable to invited Visitors in ordinary browsers, over iroh"
repository = "https://github.com/Tooobs/tooob"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
cookie = "0.18.2"
cookie_store = "0.22.1"
dialoguer = "0.12.0"
futures = "0.3.34"
getrandom = "0.4.3"
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
iroh = "1"
libc = "0.2.191"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["stream", "cookies"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.0", features = ["full"] }
tokio-tungstenite = "0.30.0"
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["fs"] }
webrtc = "0.21"

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
expectrl = "0.9.0"
getrandom = "0.4.3"
tempfile = "3.27.0"
